<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshLog - Household Food Expiry Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- OCR Library for Bill Scanning -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <main class="max-w-3xl mx-auto space-y-6">
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-4xl font-black tracking-tight text-purple-400">🥗 FreshLog</h1>
      <p class="text-slate-400 text-sm">Track kitchen inventory, prevent food waste & find quick recipes.</p>
    </header>

    <!-- Zero-Typing Smart Inputs Section -->
    <section class="bg-slate-900/90 backdrop-blur-md p-5 rounded-2xl border border-purple-500/20 shadow-xl space-y-4">
      <h2 class="text-xs font-bold uppercase tracking-widest text-purple-400">Smart Data Entry (No Typing)</h2>
      
      <!-- Voice & Bill Action Buttons -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- 1. Voice Input Button -->
        <button type="button" id="voice-btn" 
          class="flex items-center justify-center gap-2 py-3 px-4 bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/40 text-purple-300 rounded-xl font-semibold text-sm transition-all">
          <span class="text-lg">🎤</span> <span id="voice-status">Click & Speak Item</span>
        </button>

        <!-- 2. Bill Upload Input -->
        <label class="flex items-center justify-center gap-2 py-3 px-4 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 rounded-xl font-semibold text-sm transition-all cursor-pointer">
          <span class="text-lg">📄</span> <span id="bill-status">Upload Grocery Bill</span>
          <input type="file" id="bill-input" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- Bill Review & Verification Modal / Area -->
      <div id="bill-review-card" class="hidden bg-slate-950/80 border border-purple-500/40 rounded-xl p-4 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="text-xs font-bold uppercase tracking-widest text-emerald-400 flex items-center gap-2">
            <span>🔎</span> Review Extracted Items
          </h3>
          <span class="text-xs text-slate-400">Uncheck invalid / wrong items</span>
        </div>
        
        <div id="scanned-items-list" class="max-h-48 overflow-y-auto space-y-2 pr-1"></div>

        <div class="flex gap-2 justify-end pt-2 border-t border-slate-800">
          <button type="button" id="cancel-review-btn" class="px-3 py-1.5 text-xs text-slate-400 hover:text-white rounded-lg transition-all">
            Cancel
          </button>
          <button type="button" id="confirm-review-btn" class="px-4 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 font-semibold text-white rounded-lg transition-all shadow-md shadow-emerald-600/20">
            Confirm & Add to Inventory
          </button>
        </div>
      </div>

      <!-- Quick Add Section -->
      <div class="pt-2">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Or Quick Add Chips</h3>
        <div id="quick-add-container" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Add Item Form (Manual Backup) -->
      <form id="add-form" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 pt-3 border-t border-slate-800">
        <input type="text" id="item-name" placeholder="Item name (e.g., Mushroom)" required 
          class="px-3.5 py-2 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-purple-500 text-sm text-slate-100 placeholder-slate-600">
        
        <select id="item-category" 
          class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-purple-500 text-sm text-slate-300">
          <option value="VEGETABLES">Vegetables & Greens</option>
          <option value="FRUITS">Fruits</option>
          <option value="COOKED_FOOD">Cooked Food</option>
          <option value="DAIRY">Dairy & Eggs</option>
          <option value="MEAT_FISH">Meat & Seafood</option>
          <option value="BAKERY">Bakery & Snacks</option>
          <option value="PANTRY">Pantry & Groceries</option>
        </select>

        <select id="item-storage" 
          class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-purple-500 text-sm text-slate-300">
          <option value="room">🏠 Room Temp</option>
          <option value="fridge">🧊 Fridge (2x)</option>
          <option value="freezer">❄️ Freezer (5x)</option>
        </select>

        <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 font-semibold text-white rounded-xl text-sm transition-all shadow-lg shadow-purple-600/20">
          Add Item
        </button>
      </form>
    </section>

    <!-- Tracked Inventory List -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Tracked Inventory</h2>
        <span id="item-count" class="text-xs bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-purple-300 font-medium">0 Items</span>
      </div>
      <div id="inventory-list" class="space-y-3"></div>
    </section>
  </main>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
